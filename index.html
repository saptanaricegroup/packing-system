<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ระบบแพ็กสินค้า Realtime</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#182238;font-family:Arial,"Noto Sans Thai",sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head h1{margin:0;font-size:28px}.status{font-weight:800;color:#16834a}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0000000b}.title{font-size:20px;font-weight:900;margin-bottom:12px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choice,button{min-height:48px;border:2px solid #e0e5ef;background:#fff;border-radius:12px;font-weight:800;font-size:15px;padding:10px;cursor:pointer}.choice.active{background:#5b68ff;color:#fff;border-color:#5b68ff}.add{border-style:dashed;color:#5b68ff}.scan{display:flex;gap:9px}.scan input{flex:1;height:58px;border:2px solid #5b68ff;border-radius:13px;padding:0 15px;font-size:18px}.save{height:58px;background:#5b68ff;color:#fff;border:0;padding:0 25px}.selected{margin-top:10px;background:#f5f7ff;border-radius:10px;padding:10px;color:#56647c}.row{padding:11px 2px;border-bottom:1px solid #edf0f5}.danger{background:#fff0f0;color:#c52f2f;border:0}.msg{font-weight:800;margin-top:10px}.modal{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#fff;border-radius:18px;padding:20px;width:min(430px,100%)}.manage{display:flex;justify-content:space-between;align-items:center;padding:9px;border-bottom:1px solid #eee}.manage button{min-height:auto;padding:8px}.error{color:#b52e2e}.hint{color:#78859c;font-size:13px}@media(max-width:650px){.choices{grid-template-columns:repeat(2,1fr)}.scan{flex-direction:column}.save{width:100%}.head h1{font-size:24px}}</style></head><body><div class="wrap"><div class="head"><div><h1>📦 ระบบแพ็กสินค้า</h1><div class="hint">ออนไลน์ • ใช้ได้หลายเครื่อง</div></div><div id="status" class="status">● กำลังเชื่อมต่อ...</div></div><div class="card"><div class="title">1️⃣ 👤 เลือกคนแพ็ก</div><div id="people" class="choices"></div><div id="personSelected" class="selected">ยังไม่ได้เลือกคนแพ็ก</div><button class="add" style="width:100%;margin-top:9px" onclick="openAdd()">＋ เพิ่มชื่อคนแพ็ก</button><button style="width:100%;margin-top:9px" onclick="openManage()">⚙️ จัดการ/ลบชื่อ</button></div><div class="card"><div class="title">2️⃣ 🚚 เลือกขนส่ง</div><div id="carriers" class="choices"></div><div id="carrierSelected" class="selected">ยังไม่ได้เลือกขนส่ง</div></div><div class="card"><div class="title">3️⃣ 🔫 ยิงเลขพัสดุ / ออเดอร์</div><div class="scan"><input id="barcode" autofocus autocomplete="off" placeholder="ยิงบาร์โค้ดที่นี่"><button class="save" onclick="save()">บันทึก</button></div><div id="msg" class="msg"></div></div><div class="card"><div class="title">📋 รายการล่าสุด</div><div id="history"></div></div></div><div id="addModal" class="modal"><div class="box"><h2>➕ เพิ่มชื่อ</h2><input id="newName" style="width:100%;height:48px;border:2px solid #ddd;border-radius:10px;padding:10px;font-size:16px" placeholder="เช่น พี่ใหม่"><button style="width:100%;margin-top:10px;background:#5b68ff;color:#fff;border:0" onclick="addPerson()">เพิ่มชื่อ</button><button style="width:100%;margin-top:8px" onclick="closeAdd()">ยกเลิก</button></div></div><div id="manageModal" class="modal"><div class="box"><h2>⚙️ จัดการรายชื่อ</h2><div id="manageList"></div><button style="width:100%;margin-top:12px" onclick="closeManage()">ปิด</button></div></div><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script>const SB_URL='https://leznuprnfzrlgzcuskfb.supabase.co',SB_KEY='sb_publishable_U0dXOgS4xoGKlqEmtTruLg_cOt07HLR';let db=null,people=[],carriers=[],records=[],person='',carrier='';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opts={}){const r=await fetch(SB_URL+'/rest/v1/'+path,{...opts,headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:opts.method==='POST'?'return=representation':''}});const text=await r.text();let data;try{data=text?JSON.parse(text):null}catch{data=text}if(!r.ok)throw new Error(typeof data==='string'?data:(data?.message||data?.hint||r.statusText));return data}async function load(){try{const [p,c,r]=await Promise.all([api('packing_people?select=id,name&active=eq.true&order=id'),api('carriers?select=id,name&active=eq.true&order=id'),api('packing_records?select=id,barcode,packer_name,carrier_name,created_at&order=created_at.desc&limit=100')]);people=p||[];carriers=c||[];records=r||[];render();$('status').textContent='● ออนไลน์แล้ว'}catch(e){$('status').textContent='● เชื่อมต่อไม่ได้';$('status').className='status error';$('msg').textContent='กรุณารีเฟรชหน้าเว็บ: '+e.message}}function render(){$('people').innerHTML=people.map(x=>`<button class="choice ${person===x.name?'active':''}" onclick="selectPerson('${esc(x.name)}')">${esc(x.name)}</button>`).join('');$('carriers').innerHTML=carriers.map(x=>`<button class="choice ${carrier===x.name?'active':''}" onclick="selectCarrier('${esc(x.name)}')">${esc(x.name)}</button>`).join('');$('personSelected').textContent=person?'✓ คนแพ็ก: '+person:'ยังไม่ได้เลือกคนแพ็ก';$('carrierSelected').textContent=carrier?'✓ ขนส่ง: '+carrier:'ยังไม่ได้เลือกขนส่ง';$('history').innerHTML=records.map(x=>`<div class="row"><b>${esc(x.barcode)}</b><br>${esc(x.packer_name)} · ${esc(x.carrier_name)} · ${new Date(x.created_at).toLocaleString('th-TH')}</div>`).join('')||'ยังไม่มีข้อมูล'}function selectPerson(n){person=n;render()}function selectCarrier(n){carrier=n;render()}async function save(){const b=$('barcode').value.trim();if(!person)return $('msg').textContent='กรุณาเลือกคนแพ็ก';if(!carrier)return $('msg').textContent='กรุณาเลือกขนส่ง';if(!b)return $('msg').textContent='กรุณายิงเลขพัสดุ';try{await api('packing_records',{method:'POST',body:JSON.stringify({order_no:b,barcode:b,packer_name:person,carrier_name:carrier,qty:1})});$('barcode').value='';$('msg').textContent='✓ บันทึกแล้ว';await load();$('barcode').focus()}catch(e){$('msg').textContent=e.message.includes('duplicate')?'เลขพัสดุนี้ถูกบันทึกแล้ว':'บันทึกไม่สำเร็จ: '+e.message}}function openAdd(){$('addModal').classList.add('show');$('newName').focus()}function closeAdd(){$('addModal').classList.remove('show')}async function addPerson(){const n=$('newName').value.trim();if(!n)return;try{await api('packing_people',{method:'POST',body:JSON.stringify({name:n,active:true})});closeAdd();person=n;await load()}catch(e){$('msg').textContent='เพิ่มชื่อไม่สำเร็จ: '+e.message}}function openManage(){$('manageList').innerHTML=people.map(x=>`<div class="manage"><b>${esc(x.name)}</b><button class="danger" onclick="delPerson(${x.id})">🗑️ ลบ</button></div>`).join('');$('manageModal').classList.add('show')}function closeManage(){$('manageModal').classList.remove('show')}async function delPerson(id){if(!confirm('ลบชื่อนี้ออกจากรายการ?'))return;try{await api('packing_people?id=eq.'+id,{method:'PATCH',body:JSON.stringify({active:false})});if(people.find(x=>x.id===id)?.name===person)person='';await load();openManage()}catch(e){$('msg').textContent='ลบไม่สำเร็จ: '+e.message}}$('barcode').addEventListener('keydown',e=>{if(e.key==='Enter')save()});if(window.supabase){db=window.supabase.createClient(SB_URL,SB_KEY);db.channel('packing-live').on('postgres_changes',{event:'*',schema:'public',table:'packing_records'},load).on('postgres_changes',{event:'*',schema:'public',table:'packing_people'},load).on('postgres_changes',{event:'*',schema:'public',table:'carriers'},load).subscribe(s=>{if(s==='SUBSCRIBED')$('status').textContent='● Realtime เชื่อมต่อแล้ว'})}load();setInterval(load,5000);</script></body></html>
