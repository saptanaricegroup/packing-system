<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ระบบแพ็กสินค้า Realtime</title><style>body{font-family:Arial,sans-serif;background:#f4f6fb;color:#182238;margin:0}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #0000000b}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.choice,button{padding:14px;border-radius:12px;border:2px solid #e0e5ef;background:#fff;font-weight:800}.active{background:#5b68ff!important;color:#fff;border-color:#5b68ff!important}input{width:100%;box-sizing:border-box;padding:15px;border:2px solid #5b68ff;border-radius:12px;font-size:18px}.save{margin-top:10px;width:100%;background:#5b68ff;color:#fff;border:0;font-size:18px}.status{color:#16834a;font-weight:800}.row{padding:10px;border-bottom:1px solid #eee}@media(max-width:650px){.choices{grid-template-columns:repeat(2,1fr)}} </style></head><body><div class="wrap"><h1>📦 ระบบแพ็กสินค้า</h1><p class="status" id="status">● กำลังเชื่อมต่อ Realtime...</p><div class="card"><h2>1️⃣ 👤 เลือกคนแพ็ก</h2><div id="people" class="choices"></div></div><div class="card"><h2>2️⃣ 🚚 เลือกขนส่ง</h2><div id="carriers" class="choices"></div></div><div class="card"><h2>3️⃣ 🔫 ยิงเลขพัสดุ / ออเดอร์</h2><input id="barcode" autofocus placeholder="ยิงบาร์โค้ดที่นี่"><button class="save" onclick="save()">บันทึก</button><p id="msg"></p></div><div class="card"><h2>📋 รายการล่าสุด</h2><div id="history"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://leznuprnfzrlgzcuskfb.supabase.co',KEY='sb_publishable_U0dXOgS4xoGKlqEmtTruLg_cOt07HLR',db=supabase.createClient(URL,KEY);let people=[],carriers=[],records=[],person='',carrier='';const $=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){let[p,c,r]=await Promise.all([db.from('packing_people').select('id,name').eq('active',true).order('id'),db.from('carriers').select('id,name').eq('active',true).order('id'),db.from('packing_records').select('id,barcode,packer_name,carrier_name,created_at').order('created_at',{ascending:false}).limit(100)]);if(p.error||c.error||r.error){$('status').textContent='● เชื่อมต่อฐานข้อมูลไม่ได้';return}people=p.data||[];carriers=c.data||[];records=r.data||[];render();$('status').textContent='● Realtime เชื่อมต่อแล้ว'}function render(){$('people').innerHTML=people.map(x=>`<button class="choice ${person===x.name?'active':''}" onclick="person='${esc(x.name)}';render()">${esc(x.name)}</button>`).join('')+'<button onclick="addPerson()">＋ เพิ่มชื่อ</button>';$('carriers').innerHTML=carriers.map(x=>`<button class="choice ${carrier===x.name?'active':''}" onclick="carrier='${esc(x.name)}';render()">${esc(x.name)}</button>`).join('');$('history').innerHTML=records.map(x=>`<div class="row"><b>${esc(x.barcode)}</b> · ${esc(x.packer_name)} · ${esc(x.carrier_name)} · ${new Date(x.created_at).toLocaleString('th-TH')}</div>`).join('')||'ยังไม่มีข้อมูล'}async function save(){let b=$('barcode').value.trim();if(!person||!carrier||!b){$('msg').textContent='กรุณาเลือกคนแพ็ก ขนส่ง และยิงเลขพัสดุ';return}let{error}=await db.from('packing_records').insert({order_no:b,barcode:b,packer_name:person,carrier_name:carrier,qty:1});if(error){$('msg').textContent=error.code==='23505'?'เลขนี้ถูกบันทึกแล้ว':error.message;return}$('barcode').value='';$('msg').textContent='✓ บันทึกแล้ว'}async function addPerson(){let n=prompt('ชื่อพนักงาน');if(!n)return;let{error}=await db.from('packing_people').insert({name:n.trim(),active:true});if(error)alert(error.message);else load()}$('barcode').addEventListener('keydown',e=>{if(e.key==='Enter')save()});db.channel('packing-system-live').on('postgres_changes',{event:'*',schema:'public',table:'packing_records'},load).on('postgres_changes',{event:'*',schema:'public',table:'packing_people'},load).on('postgres_changes',{event:'*',schema:'public',table:'carriers'},load).subscribe();load();</script></body></html>
