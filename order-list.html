<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายการออเดอร์ - Real-time</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#172033;font-family:Arial,"Noto Sans Thai",sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0001}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.status{padding:7px 10px;border-radius:99px;background:#e9f8ef;color:#13733c;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f4f6ff;border-radius:14px;padding:14px}.stat b{display:block;font-size:27px;margin-top:5px}
.tools{display:grid;grid-template-columns:1fr 180px;gap:10px}input,button{font-size:16px;padding:12px;border-radius:11px}input{width:100%;border:2px solid #dfe4ef}button{border:0;background:#5b68ff;color:#fff;font-weight:800;cursor:pointer}.danger{background:#ef5350}.muted{color:#78849a;font-size:14px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}th{background:#f8f9fc}.tag{display:inline-block;background:#eef0ff;border-radius:8px;padding:4px 7px;margin:2px}
#drop{border:2px dashed #b8c0d0;border-radius:14px;padding:22px;text-align:center;margin-top:10px}#drop.drag{border-color:#5b68ff;background:#f1f3ff}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.tools{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="card"><div class="top"><div><h1 style="margin:0">📋 รายการออเดอร์ Real-time</h1><div class="muted">เว็บแยกจากระบบแพ็กสินค้าเดิม</div></div><span id="status" class="status">กำลังเชื่อมต่อ…</span></div></div>
<div class="card"><h2>📥 นำเข้าไฟล์ออเดอร์</h2><input id="file" type="file" accept=".pdf,.csv,.xlsx,.xls"><div id="drop">รองรับ PDF / CSV / Excel ของ Seller Centre<br><small class="muted">ระบบจะแยก เลขออเดอร์ • เลขพัสดุ • รายการข้าว • จำนวน • น้ำหนัก ให้ทันที</small></div><div id="importMsg" style="margin-top:10px"></div></div>
<div class="card"><h2>📊 สรุป</h2><div class="stats"><div class="stat">📦 ออเดอร์<b id="orders">0</b></div><div class="stat">🍚 แพ็กทั้งหมด<b id="packs">0</b></div><div class="stat">⚖️ น้ำหนักรวม<b id="kg">0.00 กก.</b></div></div></div>
<div class="card"><h2>🔎 ค้นหา</h2><div class="tools"><input id="q" placeholder="เลขออเดอร์ / เลขพัสดุ / ชื่อข้าว"><button id="clear">ล้างการค้นหา</button></div></div>
<div class="card"><h2>📋 รายการ</h2><div id="table" class="tablewrap"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const SB_URL="https://leznuprnfzrlgzcuskfb.supabase.co";const SB_KEY="sb_publishable_U0dXOgS4xoGKlqEmtTrLuLg_cOt07HLR";const db=supabase.createClient(SB_URL,SB_KEY);let rows=[],sub;
function today(){return new Date().toISOString().slice(0,10)}function num(v){if(v===null||v===undefined||v==="")return 0;return parseFloat(String(v).replace(/,/g,"").replace(/[^\d.-]/g,""))||0}function pick(o,words){let ks=Object.keys(o);let k=ks.find(x=>words.some(w=>x.toLowerCase().replace(/\s/g,"").includes(w)));return k?o[k]:""}
function normalize(o){const order=String(pick(o,["เลขที่คำสั่งซื้อ","เลขออเดอร์","orderid","orderno","order id","order no","หมายเลขคำสั่งซื้อ","shopee order no"])||"").trim();const track=String(pick(o,["เลขพัสดุ","tracking","trackingno","tracking number","เลขแทร็ค"])||"").trim();const product=String(pick(o,["ชื่อสินค้า","รายการสินค้า","productname","product","สินค้า","ชื่อ"])||"").trim();const qty=num(pick(o,["จำนวน","qty","quantity"]));let kg=num(pick(o,["น้ำหนักต่อหน่วย","หน่วยกิโล","unitkg","น้ำหนัก/หน่วย"]));if(!kg){let w=num(pick(o,["น้ำหนัก","weight","กิโล"]));if(w&&qty)kg=w/qty;else kg=w}const d=String(pick(o,["วันที่","orderdate","order date","วันที่สั่งซื้อ"])||today()).slice(0,10);return{order_no:order,tracking_no:track,product_name:product,qty:qty||1,unit_kg:kg||guessKg(product),order_date:d}}
function guessKg(s){let x=String(s||"").match(/(\d+(?:\.\d+)?)\s*(?:กก|kg|กิโล|กิโลกรัม)/i);if(x)return +x[1];let g=String(s||"").match(/(\d+)\s*(?:กรัม|g)/i);return g?+g[1]/1000:1}
function pdfLines(items){const groups=[];for(const it of items){const t=String(it.str||"").trim();if(!t)continue;const y=Math.round((it.transform&&it.transform[5]||0)*10)/10;let g=groups.find(x=>Math.abs(x.y-y)<1.5);if(!g){g={y,items:[]};groups.push(g)}g.items.push(it)}groups.sort((a,b)=>b.y-a.y);return groups.map(g=>g.items.sort((a,b)=>(a.transform?.[4]||0)-(b.transform?.[4]||0)).map(x=>x.str).join(" ").replace(/\s+/g," ").trim()).filter(Boolean)}
function parsePdfPage(lines){const text=lines.join("\n");const order=(text.match(/Shopee\s*Order\s*No\.\s*([A-Z0-9]+)/i)||[])[1]||"";const track=(text.match(/\b(TH[0-9A-Z]{10,})\b/i)||[])[1]||"";const date=(text.match(/PICKUP\s*DATE\s*(\d{2}-\d{2}-\d{4})/i)||[])[1]||today().split("-").reverse().join("-");const start=lines.findIndex(x=>/ชื่อสินค้า/i.test(x));const end=lines.findIndex((x,i)=>i>start&&/Shopee\s*Order\s*No\./i.test(x));const body=start>=0?lines.slice(start+1,end>start?end:lines.length):[];const out=[];for(const line of body){const m=line.match(/^\s*(\d+)\s+(.+?)\s+(\d+)\s*$/);if(!m)continue;const product=m[2].replace(/\s{2,}/g," ").trim();if(!/ข้าว|ไรซ์|มะลิ|กล้อง|เหนียว/i.test(product))continue;out.push({order_no:order,tracking_no:track,product_name:product,qty:+m[3],unit_kg:guessKg(product),order_date:date})}if(!out.length){for(const line of body){if(!/ข้าว|ไรซ์|มะลิ|กล้อง|เหนียว/i.test(line))continue;const q=(line.match(/\s(\d+)\s*$/)||[])[1];if(q)out.push({order_no:order,tracking_no:track,product_name:line.replace(/\s+\d+\s*$/,'').trim(),qty:+q,unit_kg:guessKg(line),order_date:date})}}return out}
async function importPdf(file){importMsg.innerHTML='<span style="color:#355dcc">⏳ กำลังอ่าน PDF...</span>';const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';const pdf=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const mapped=[];for(let n=1;n<=pdf.numPages;n++){const page=await pdf.getPage(n),tc=await page.getTextContent();mapped.push(...parsePdfPage(pdfLines(tc.items)))}await saveImported(mapped,`PDF ${pdf.numPages} หน้า`)}
async function saveImported(mapped,label){const clean=mapped.filter(x=>x.order_no&&x.product_name).map(x=>({...x,qty:+x.qty||1,unit_kg:+x.unit_kg||guessKg(x.product_name)}));if(!clean.length){importMsg.innerHTML='<span style="color:#b3261e">❌ อ่านไฟล์แล้ว แต่ไม่พบรายการข้าว/เลขออเดอร์</span>';return}const{error}=await db.from("order_items").upsert(clean,{onConflict:"order_no,tracking_no,product_name"});if(error){importMsg.innerHTML='<span style="color:#b3261e">❌ นำเข้าไม่สำเร็จ: '+error.message+'</span>';return}importMsg.innerHTML='<b style="color:#13733c">✅ '+label+' • นำเข้าสำเร็จ '+clean.length+' รายการ • เครื่องอื่นเห็นข้อมูล Real-time</b>';await load()}
async function importFile(file){try{if(file.name.toLowerCase().endsWith('.pdf'))return await importPdf(file);const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]],raw=XLSX.utils.sheet_to_json(ws,{defval:''});await saveImported(raw.map(normalize),'Excel/CSV')}catch(e){console.error(e);importMsg.innerHTML='<span style="color:#b3261e">❌ อ่านไฟล์ไม่สำเร็จ: '+(e?.message||e)+'</span>'}}
async function load(){let{data,error}=await db.from("order_items").select("*").order("imported_at",{ascending:false}).limit(5000);if(error){status.textContent="เชื่อมต่อไม่ได้";status.style.background="#ffecec";status.style.color="#b3261e";console.error(error);return}rows=data||[];render();status.textContent="● Real-time พร้อม";if(sub)sub.unsubscribe();sub=db.channel("order_items_rt").on("postgres_changes",{event:"*",schema:"public",table:"order_items"},()=>load()).subscribe()}
function render(){const q=document.getElementById("q").value.toLowerCase().trim();const f=rows.filter(r=>(r.order_no+" "+r.tracking_no+" "+r.product_name).toLowerCase().includes(q));const ordersSet=new Set(f.map(x=>x.order_no));let packs=0,kg=0;f.forEach(x=>{packs+=+x.qty||0;kg+=(+x.qty||0)*(+x.unit_kg||0)});orders.textContent=ordersSet.size;packsEl.textContent=packs;kgEl.textContent=kg.toFixed(2)+" กก.";const grouped={};f.forEach(r=>(grouped[r.order_no]??=[]).push(r));table.innerHTML=Object.keys(grouped).length?`<table><thead><tr><th>เลขออเดอร์</th><th>เลขพัสดุ</th><th>รายการข้าว</th><th>แพ็ก</th><th>กก.</th></tr></thead><tbody>`+Object.values(grouped).map(items=>{let p=0,k=0;items.forEach(i=>{p+=+i.qty;k+=(+i.qty)*(+i.unit_kg)});return `<tr><td><b>${items[0].order_no}</b></td><td>${items[0].tracking_no||"-"}</td><td>${items.map(i=>`<span class="tag">🍚 ${i.product_name} × ${i.qty}</span>`).join("")}</td><td>${p}</td><td><b>${k.toFixed(2)}</b></td></tr>`}).join("")+"</tbody></table>":"<div class='muted'>ยังไม่มีรายการ</div>"}
const packsEl=document.getElementById("packs"),kgEl=document.getElementById("kg");q.oninput=render;clear.onclick=()=>{q.value="";render()};file.onchange=e=>e.target.files[0]&&importFile(e.target.files[0]);drop.ondragover=e=>{e.preventDefault();drop.classList.add("drag")};drop.ondragleave=()=>drop.classList.remove("drag");drop.ondrop=e=>{e.preventDefault();drop.classList.remove("drag");if(e.dataTransfer.files[0])importFile(e.dataTransfer.files[0])};load();
</script></body></html>
